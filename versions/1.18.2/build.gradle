plugins { id 'java-library'; id 'net.neoforged.moddev.legacyforge' version '2.0.148' }
ext.repositoryRoot = file('../..')
ext.minecraftTarget = '1.18.2'
ext.loaderTarget = 'forge'
ext.loaderVersion = '1.18.2-40.3.12'
ext.javaTarget = 17
apply from: '../../build-logic/version.gradle'
apply from: '../../build-logic/shared.gradle'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
legacyForge {
    version = loaderVersion
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { examplemod { sourceSet sourceSets.main } }
}
jar.finalizedBy 'reobfJar'

// The Forge userdev workflow references this ZIP but omits it from NFRT's default manifest.
def mcpConfig = configurations.create('legacyMcpConfig') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}
dependencies { legacyMcpConfig 'de.oceanlabs.mcp:mcp_config:1.18.2-20220404.173914@zip' }
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach { addArtifactsToManifest(mcpConfig) }
