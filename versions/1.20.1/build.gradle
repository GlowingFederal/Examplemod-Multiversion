plugins { id 'java-library'; id 'net.neoforged.moddev.legacyforge' version '2.0.148' }
ext.repositoryRoot = file('../..')
ext.minecraftTarget = '1.20.1'
ext.loaderTarget = 'forge'
ext.loaderVersion = '1.20.1-47.4.10'
ext.javaTarget = 17
apply from: '../../build-logic/version.gradle'
apply from: '../../build-logic/shared.gradle'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
legacyForge {
    version = loaderVersion
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { examplemod { sourceSet sourceSets.main } }
}
jar.finalizedBy 'reobfJar'
