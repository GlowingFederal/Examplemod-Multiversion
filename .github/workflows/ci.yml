name: Build all supported versions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mod-version: ${{ steps.version.outputs.mod_version }}
      build-number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: version
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          plan = json.loads(subprocess.check_output(['python3', 'scripts/build.py', 'plan']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for key, value in plan.items():
                  stream.write(f'{key}={value}\n')
          PY
  builds:
    needs: plan
    uses: ./.github/workflows/build-matrix.yml
    with:
      mod-version: ${{ needs.plan.outputs.mod-version }}
      build-number: ${{ needs.plan.outputs.build-number }}
