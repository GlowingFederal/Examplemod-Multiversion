name: Independent target builds
on:
  workflow_call:
    inputs:
      mod-version:
        required: true
        type: string
      build-number:
        required: true
        type: string
permissions:
  contents: read
jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: sh ./gradlew :common:test --console=plain
  targets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: 1.6.4
            jdks: "8\n21"
          - mc: 1.7.10
            jdks: "8\n17\n25"
          - mc: 1.8.9
            jdks: "8\n21"
          - mc: 1.12.2
            jdks: "8\n21"
          - mc: 1.16.5
            jdks: "8\n21"
          - mc: 1.18.2
            jdks: "17\n21"
          - mc: 1.20.1
            jdks: "17\n21"
          - mc: 1.21.11
            jdks: "21"
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.ci-gradle/${{ matrix.mc }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ matrix.jdks }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-gradle/${{ matrix.mc }}
          key: ${{ runner.os }}-gradle-${{ matrix.mc }}-${{ hashFiles(format('versions/{0}/gradle/wrapper/gradle-wrapper.properties', matrix.mc), format('versions/{0}/target.json', matrix.mc), format('versions/{0}/*.gradle', matrix.mc), 'build-logic/*.gradle') }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile, test and remap the selected target
        working-directory: versions/${{ matrix.mc }}
        run: sh ./gradlew build --console=plain --max-workers=2 -PreleaseModVersion=${{ inputs.mod-version }} -PreleaseBuildNumber=${{ inputs.build-number }}
      - name: Verify production archive and versions
        run: python scripts/build.py verify ${{ matrix.mc }} --full-version ${{ inputs.mod-version }}.${{ inputs.build-number }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: examplemod-mc${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/examplemod-${{ inputs.mod-version }}.${{ inputs.build-number }}+mc${{ matrix.mc }}-*.jar
          if-no-files-found: error
